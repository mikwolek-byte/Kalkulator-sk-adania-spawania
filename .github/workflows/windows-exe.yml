name: Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-exe.yml']
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Test calculations and UI
        run: |
          python -m unittest -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python check_ui.py
      - name: Build standalone EXE
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile
          --name KalkulatorZekon
          --collect-all streamlit --collect-all altair
          --copy-metadata streamlit --copy-metadata pandas --copy-metadata pyarrow
          --hidden-import engine --hidden-import import_eiffage
          --add-data "app.py;." --add-data "engine.py;." --add-data "import_eiffage.py;."
          launcher.py
      - name: Start packaged EXE and check HTTP service
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath '.\dist\KalkulatorZekon.exe' -ArgumentList '--smoke-test' -PassThru -RedirectStandardOutput exe-out.log -RedirectStandardError exe-err.log
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              Start-Sleep -Seconds 2
              if ($proc.HasExited) { throw 'EXE exited before startup' }
              try {
                $response = Invoke-WebRequest 'http://127.0.0.1:8501/_stcore/health' -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $healthy = $true; break }
              } catch { }
            }
            if (-not $healthy) { throw 'EXE did not become healthy' }
            $page = Invoke-WebRequest 'http://127.0.0.1:8501/' -TimeoutSec 10
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch 'Streamlit') { throw 'Missing frontend' }
          } finally {
            if (-not $proc.HasExited) { Stop-Process -Id $proc.Id -Force }
            Get-Content exe-out.log -ErrorAction SilentlyContinue
            Get-Content exe-err.log -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: KalkulatorZekon-Windows
          path: dist/KalkulatorZekon.exe
          if-no-files-found: error
